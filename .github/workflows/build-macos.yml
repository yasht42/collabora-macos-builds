name: Build & Release Collabora Office macOS (arm64)

on:
  schedule:
    # Poll upstream Collabora repository every 6 hours for new cp-* release tags
    - cron: '0 */6 * * *'
  push:
    tags:
      - 'v*'
      - 'cp-*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Collabora monorepo branch, tag, or commit to build'
        required: true
        default: 'main'
        type: string
      distro_config:
        description: 'Engine distro-config (e.g. CPMacOS-LOKit or LibreOfficeMacOSX)'
        required: true
        default: 'CPMacOS-LOKit'
        type: string
      build_type:
        description: 'Build configuration mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - dbgutil
      languages:
        description: 'UI languages (e.g. "en-US de fr es" or "without-lang")'
        required: true
        default: 'without-lang'
        type: string
      build_macos_wrapper:
        description: 'Build top-level web-based macOS desktop app (browser/ JS frontend + macos/ CODA wrapper)'
        required: false
        default: true
        type: boolean
      create_release:
        description: 'Create/update a GitHub Release with the built packages'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Release tag name for manual runs (defaults to v<YYYY.MM.DD>-<run_number>)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-upstream:
    name: Check Upstream for New Release Tags
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
    steps:
      - name: Determine if Build is Required
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: 'https://gerrit.collaboraoffice.com/online'
        run: |
          set -euo pipefail

          # Manual dispatch or tag push always builds immediately
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "Triggered by ${{ github.event_name }}; proceeding to build."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "upstream_tag=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "==> Fetching upstream tags from ${UPSTREAM_REPO}..."
          LATEST_TAG=$(git ls-remote --tags --refs "${UPSTREAM_REPO}" \
            | awk '{sub("refs/tags/", "", $2); print $2}' \
            | grep -E '^cp-(2[5-9]|[3-9][0-9])\.[0-9]+\.[0-9]+-[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)

          if [[ -z "${LATEST_TAG}" ]]; then
            echo "No matching upstream cp-* tags (25.04+) found."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            echo "upstream_tag=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Latest upstream tag detected: ${LATEST_TAG}"

          # Check if a GitHub Release for this tag already exists in this repository
          if gh release view "${LATEST_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
             || gh release view "v${LATEST_TAG#cp-}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release for ${LATEST_TAG} already exists in ${{ github.repository }}. Skipping build."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            echo "upstream_tag=${LATEST_TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "New upstream tag ${LATEST_TAG} has not been built yet! Triggering macOS build."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "upstream_tag=${LATEST_TAG}" >> "${GITHUB_OUTPUT}"
          fi

  build-macos-arm64:
    name: Build Collabora Office (macOS arm64)
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Determine Version, Source Ref & Release Tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && -n "${{ needs.check-upstream.outputs.upstream_tag }}" ]]; then
            SOURCE_REF="${{ needs.check-upstream.outputs.upstream_tag }}"
            TAG="${SOURCE_REF}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            if [[ "${TAG}" == cp-* ]]; then
              SOURCE_REF="${TAG}"
            else
              SOURCE_REF="${{ inputs.ref || 'main' }}"
            fi
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
            SOURCE_REF="${{ inputs.ref || 'main' }}"
          else
            TAG="v$(date -u +'%Y.%m.%d')-build.${{ github.run_number }}"
            SOURCE_REF="${{ inputs.ref || 'main' }}"
          fi

          VERSION="${TAG#v}"
          VERSION="${VERSION#cp-}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=${SOURCE_REF}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release tag: ${TAG} (version: ${VERSION}, source_ref: ${SOURCE_REF})"

      - name: Build and Package Collabora Office for macOS
        id: build
        uses: ./
        with:
          repository_url: 'https://gerrit.collaboraoffice.com/online'
          ref: ${{ steps.meta.outputs.source_ref }}
          distro_config: ${{ inputs.distro_config || 'CPMacOS-LOKit' }}
          vendor: 'Collabora'
          build_type: ${{ inputs.build_type || 'release' }}
          languages: ${{ inputs.languages || 'without-lang' }}
          build_macos_wrapper: ${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.build_macos_wrapper && 'true' || 'false') }}
          version_tag: ${{ steps.meta.outputs.version }}
          enable_cache: 'true'
          macos_certificate_p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          macos_certificate_password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
          apple_app_specific_password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: CollaboraOffice-${{ steps.meta.outputs.version }}-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.app.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'schedule' || github.ref_type == 'tag' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Collabora Office macOS (arm64) - ${{ steps.meta.outputs.tag }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ## Collabora Office for macOS (Apple Silicon `arm64`)

            Automated build of Collabora Office Desktop / Core (`engine/`) for macOS (`arm64`).

            ### Build Metadata
            - **Source Repository:** `https://gerrit.collaboraoffice.com/online` (`engine/`)
            - **Source Ref:** `${{ steps.meta.outputs.source_ref }}`
            - **Distro Config:** `${{ inputs.distro_config || 'CPMacOS-LOKit' }}`
            - **Build Type:** `${{ inputs.build_type || 'release' }}`
            - **Languages:** `${{ inputs.languages || 'without-lang' }}`
            - **Runner:** `macos-15` (`arm64`)

            ### Included Files
            - `CollaboraOffice-${{ steps.meta.outputs.version }}-macOS-arm64.dmg` — macOS Disk Image installer
            - `CollaboraOffice-${{ steps.meta.outputs.version }}-macOS-arm64.app.zip` — Compressed `.app` bundle
            - `SHA256SUMS.txt` — SHA-256 checksums for verification
          files: |
            dist/*.dmg
            dist/*.app.zip
            dist/SHA256SUMS.txt
